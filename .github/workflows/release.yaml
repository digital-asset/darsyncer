name: release

on:
  workflow_run:
    workflows: ["build"] # Only run on main if build step passed
    types: [completed]
    branches: ["release-and-tag"]

permissions:
  contents: write

defaults:
  run:
    shell: bash -euo pipefail -c "source nix.source && export PATH=$GITHUB_WORKSPACE/bin:$PATH && exec bash {0}"

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: digital-asset-darsyncer
    steps:
      - name: Checkout built commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - uses: ./.github/actions/nix
      - uses: ./.github/actions/gcloud-login
        with:
          key: ${{ secrets.DA_IMAGES }}

      - name: Read release version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          : "${version:?VERSION file must not be empty}"
          git check-ref-format "refs/tags/$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Release Docker image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          source nix.source
          gcloud beta auth configure-docker "europe-docker.pkg.dev"
          ./scripts/gha/release.sh

      - name: Create and push git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          existing="$(git ls-remote --tags --refs origin "refs/tags/$VERSION")"
          if [[ -n "$existing" ]]; then
            echo "Tag $VERSION already exists; skipping."
          else
            git tag "$VERSION" HEAD
            git push origin "refs/tags/$VERSION" --dry-run
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tags="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')"
          if grep -Fxq -- "$VERSION" <<< "$tags"; then
            echo "Release $VERSION already exists; skipping."
          else
            gh release create "$VERSION" \
              --verify-tag \
              --draft \
              --prerelease \
              --fail-on-no-commits \
              --title "$VERSION" \          
              --generate-notes
          fi
